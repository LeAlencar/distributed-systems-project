version: "3.8"

services:
  # Servidor de Referência (Parte 4)
  reference-server:
    build: ./reference-server
    container_name: reference-server
    ports:
      - "5559:5559" # REP - servidores conectam para rank/list/heartbeat
    restart: unless-stopped
    networks:
      - chat-network

  # Broker Request-Reply para load balancing
  req-rep-broker:
    build: ./req-rep-broker
    container_name: req-rep-broker
    ports:
      - "5555:5555" # ROUTER - clientes conectam aqui
      - "5556:5556" # DEALER - servidores conectam aqui
    restart: unless-stopped
    networks:
      - chat-network

  # Proxy PubSub para mensagens e canais
  pubsub-proxy:
    build: ./pubsub-proxy
    container_name: pubsub-proxy
    ports:
      - "5557:5557" # XSUB - publishers conectam aqui
      - "5558:5558" # XPUB - subscribers conectam aqui
    restart: unless-stopped
    networks:
      - chat-network

  # Servidor Node.js com TypeScript
  chat-server:
    build: ./node-server
    depends_on:
      - reference-server
      - req-rep-broker
      - pubsub-proxy
    # Sem volume compartilhado - cada réplica tem seu próprio banco SQLite
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - chat-network
    deploy:
      replicas: 3

  # Cliente Ruby Interativo (Request-Reply + PubSub)
  ruby-client:
    build: ./ruby-client
    container_name: ruby-client
    depends_on:
      - req-rep-broker
      - pubsub-proxy
      - chat-server
    stdin_open: true
    tty: true
    networks:
      - chat-network
    command:
      [
        "sh",
        "-c",
        "sleep 3 && ruby interactive_client.rb req-rep-broker 5555 pubsub-proxy 5558",
      ]

  # Cliente Automático Python (Parte 2)
  python-auto-client:
    build: ./python-auto-client
    depends_on:
      - req-rep-broker
      - pubsub-proxy
      - chat-server
    networks:
      - chat-network
    restart: unless-stopped
    deploy:
      replicas: 2

networks:
  chat-network:
    driver: bridge
